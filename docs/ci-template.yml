# Copy this file to .github/workflows/ci.yml to enable the checks in your fork.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Scan this repository
        env:
          PYTHONPATH: src
        run: python -m oss_security_audit . --fail-on high
