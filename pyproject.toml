[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-security-audit"
version = "0.1.0"
description = "A local, privacy-friendly security baseline scanner for source repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lolcubaba31" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
oss-security-audit = "oss_security_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
